<div class="pelicula-container">
  <p>{{ pelicula.id }}</p>
  <p>{{ pelicula.nombre }}</p>
  <p>{{ pelicula.imagen }}</p>
  <p>{{ pelicula.sinopsis }}</p>
  <p>{{ pelicula.duracion }}</p>
  <p>{{ pelicula.genero }}</p>
  <p>{{ pelicula.clasificacionEdad }}</p>
  <p>{{ pelicula.fechaEstreno }}</p>
  <p>{{ pelicula.estaDisponible }}</p>
  <button (click)="emitirSeleccion()">Ver Detalle</button>
</div>
